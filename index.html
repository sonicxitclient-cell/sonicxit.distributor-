<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONIC XIT - Premium Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #060608; --glow: #00A3FF; --inp: #161A22; --border: #252A35; --text: #FFF; --succ: #00FF66; --dang: #FF3B30; --panel-bg: #0d1117; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: 0.3s;}
        .container { width: 100%; max-width: 420px; position: relative;}
        
        .screen { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; width: 100%;}
        .screen.active { display: flex; }
        
        /* شاشة الدخول */
        #login-screen { text-align: center; }
        .logo-title { font-family: 'Orbitron'; font-size: 45px; font-weight: 900; font-style: italic; line-height: 1; }
        .logo-title .sonic { color: #FFF; } .logo-title .xit { color: var(--glow); }
        .logo-sub { color: var(--glow); font-family: 'Orbitron'; font-weight: bold; font-size: 18px; margin-top: -5px; }
        .sub-text { color: #8E95A3; font-size: 14px; margin-bottom: 20px; }
        
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--inp); color: #FFF; text-align: center; outline: none; margin-bottom: 10px; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(90deg, #0056b3, #00A3FF); color: #FFF; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        
        .tabs { display: flex; width: 100%; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; border: none; border-radius: 8px; background: var(--inp); color: #8E95A3; cursor: pointer; font-weight: bold; font-size: 13px;}
        .tab.active { background: var(--glow); color: #000; }

        /* لوحة الأدمن */
        #admin-screen { text-align: right; }
        .admin-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .admin-panel h3 { color: var(--glow); font-size: 16px; margin-bottom: 15px; text-align: center;}
        .user-item { background: var(--inp); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;}
        .user-item span { font-family: 'Orbitron'; color: var(--glow); }
        .del-btn { background: rgba(255,59,48,0.1); color: var(--dang); border: 1px solid var(--dang); padding: 5px 10px; border-radius: 6px; cursor: pointer; }

        /* لوحة الموزع */
        #reseller-screen { text-align: right; }
        .reseller-code-box { text-align: center; margin-bottom: 20px; }
        .reseller-code-box h4 { color: #8E95A3; font-size: 12px; letter-spacing: 2px; margin-bottom: 5px; }
        .reseller-code-big { font-family: 'Orbitron'; font-size: 24px; color: var(--glow); font-weight: bold; text-shadow: 0 0 15px rgba(0,163,255,0.6); }

        .balance-card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .balance-title { color: #8E95A3; font-size: 12px; letter-spacing: 2px; margin-bottom: 5px; }
        .balance-amount { font-family: 'Orbitron'; font-size: 36px; font-weight: 900; color: var(--succ); }
        .balance-sub { color: #8E95A3; font-size: 12px; margin-top: 5px; }
        .balance-sub span { color: var(--glow); }

        .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .panel-title { color: var(--glow); font-size: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-weight:bold; }
        
        /* العداد المكبر */
        .gen-container { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; }
        .counter-box { display: flex; flex-direction: column; background: var(--inp); border: 1px solid var(--border); border-radius: 8px; width: 75px; overflow: hidden; justify-content: space-between;}
        .counter-box button { background: transparent; border: none; color: var(--glow); font-size: 18px; cursor: pointer; padding: 8px; transition: 0.2s; }
        .counter-box button:hover { background: rgba(0,163,255,0.1); }
        .counter-box input { border: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: transparent; color: #FFF; text-align: center; font-size: 20px; font-family: 'Orbitron'; padding: 8px 0; margin: 0; outline: none; width: 100%; }
        .counter-box input::-webkit-outer-spin-button, .counter-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .gen-btn { flex: 1; background: #007bff; color: #FFF; padding: 14px; border-radius: 8px; font-weight: bold; border:none; cursor:pointer; font-size: 16px; box-shadow: 0 0 15px rgba(0,123,255,0.3); display: flex; align-items: center; justify-content: center;}
        
        .keys-container { width: 100%; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .keys-header { display: grid; grid-template-columns: 30px 1fr 50px 80px 70px; background: #11151c; padding: 10px; color: #58a6ff; font-size: 12px; font-weight: bold; text-align: center; }
        .key-row { display: grid; grid-template-columns: 30px 1fr 50px 80px 70px; padding: 12px 10px; border-bottom: 1px solid var(--border); align-items: center; font-size: 13px; text-align: center; }
        .key-row:last-child { border-bottom: none; }
        .key-name { font-family: 'Orbitron'; color: #58a6ff; font-size: 11px; word-break: break-all; text-align: right;}
        .key-status { color: var(--succ); border: 1px solid var(--succ); padding: 2px 6px; border-radius: 10px; font-size: 10px; background: rgba(0,255,102,0.1);}
        .key-status.used { color: var(--dang); border-color: var(--dang); background: rgba(255,59,48,0.1);}
        .key-actions { display: flex; gap: 5px; justify-content: center; }
        .icon-btn { background: var(--inp); border: 1px solid var(--border); color: #8E95A3; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--glow); color: white; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100; font-weight:bold;}
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

      .admin-panel h3,.panel-title{color:#20c5ff}

      .balance-amount{font-size:clamp(34px,6vw,48px);text-shadow:0 0 22px rgba(0,239,131,.18)}
      .gen-container{gap:12px}
      .counter-box{border-radius:12px;border-color:var(--border);min-width:76px}

      .keys-container{border:0;overflow-x:auto;background:#050b15;border-radius:13px}
      .keys-header,.key-row{min-width:650px;grid-template-columns:34px minmax(170px,1fr) 62px 90px 112px}
      .keys-header{background:#0b1a2d;color:#36caff}
      .key-row{background:rgba(8,17,31,.8);border-bottom:1px solid rgba(80,140,190,.13)}

      .user-item{background:#081426;border-color:rgba(0,163,255,.2);border-radius:12px;padding:13px}

      #toast{
        bottom:24px;background:#087fc5;border:1px solid #54ceff;

      a{color:#38caff!important}
      @media(min-width:850px){
        body:has(#reseller-screen.active) .container{max-width:1120px}
        #reseller-screen{
          display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.75fr);

        .reseller-code-box{grid-area:top;text-align:center}

        #reseller-screen .panel:first-of-type{grid-area:generator}
        #reseller-screen .panel:nth-of-type(2){grid-area:keys}
        #reseller-screen>.btn{grid-area:logout;max-width:220px;justify-self:center}

        .panel-title{font-size:13px}
        .keys-header,.key-row{min-width:590px}

    </style>

    <script>
        const BIN_ID = "6af38208ffd5d16053b7be3b";
        const API_KEY = "$2a$10$hwehRSCL5qz8WnzrHvHiAup6Xqjpv15c1vwCl0QxHxyCNaq90TrO.";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let currentReseller = null, currentBalance = 230.00;
        let lastGeneratedCode = "";

        function toast(m) { const el = document.getElementById('toast'); el.innerText = m; el.style.opacity = 1; setTimeout(()=>el.style.opacity=0, 3000); }
        function switchScreen(id) { document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function switchTab(t) { 
            document.getElementById('tab-res').classList.toggle('active', t==='res'); 
            document.getElementById('tab-admin').classList.toggle('active', t==='admin'); 
            document.getElementById('sec-res').style.display = t==='res'?'block':'none'; 
            document.getElementById('sec-admin').style.display = t==='admin'?'block':'none'; 
        }
        
        async function fetchDB() { const r = await fetch(`${API_URL}/latest`, {headers:{'X-Master-Key':API_KEY}}); const d = await r.json(); return d.record || {}; }
        async function saveDB(db) { await fetch(API_URL, {method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':API_KEY}, body:JSON.stringify(db)}); }

        // ========== دوال الأدمن ==========
        window.loginAdmin = function() {
            if(document.getElementById('admin-pass').value.trim() === "SONIC112211") {
                switchScreen('admin-screen');
                renderAdmin();
            } else { toast("كلمة مرور خاطئة"); }
        };
        
        window.createReseller = async function() {
            const u = document.getElementById('new-user').value.trim(), p = document.getElementById('new-pass').value.trim();
            if(!u||!p) return toast("أدخل البيانات");
            const db = await fetchDB();
            if(!db.users) db.users = {};
            if(db.users[u]) return toast("الاسم موجود مسبقاً");
            db.users[u] = { password: p, balance: 230.00 };
            await saveDB(db);
            document.getElementById('new-user').value = ''; document.getElementById('new-pass').value = '';
            toast("تم الإنشاء"); renderAdmin();
        };

        window.renderAdmin = async function() {
            const list = document.getElementById('admin-users-list');
            list.innerHTML = 'Loading...';
            const db = await fetchDB();
            list.innerHTML = '';
            if(!db.users || Object.keys(db.users).length === 0) { list.innerHTML = '<div style="text-align:center; color:#8E95A3;">لا يوجد موزعين</div>'; return; }
            for(let u in db.users) {
                const div = document.createElement('div'); div.className='user-item';
                div.innerHTML = `<div><span>${u}</span><br><small style="color:#8E95A3;">Pass: ${db.users[u].password}</small></div><button class="del-btn" onclick="deleteReseller('${u}')">حذف</button>`;
                list.appendChild(div);
            }
        };

        window.deleteReseller = async function(u) {
            if(!confirm("حذف الموزع؟")) return;
            const db = await fetchDB(); delete db.users[u]; await saveDB(db); renderAdmin();
        };

        // ========== دوال الموزع ==========
        window.loginReseller = async function() {
            const u = document.getElementById('res-user').value.trim(), p = document.getElementById('res-pass').value.trim();
            if(!u||!p) return toast("أدخل البيانات");
            const db = await fetchDB();
            if(!db.users||!db.users[u]||db.users[u].password!==p) return toast("خطأ في البيانات");
            currentReseller = u;
            switchScreen('reseller-screen');
            document.getElementById('disp-res-code').innerText = u.toUpperCase(); 
            if(db.users[u].balance===undefined) { db.users[u].balance=230; await saveDB(db); }
            currentBalance = db.users[u].balance;
            document.getElementById('balance-amount').innerText = currentBalance.toFixed(2);
            renderKeys();
        };

        window.changeCount = function(a) {
            const inp = document.getElementById('key-count-input');
            let v = parseInt(inp.value) + a;
            if(v < 1) v = 1; if(v > 50) v = 50;
            inp.value = v;
        };

        window.genKey = async function() {
            const btn = document.getElementById('gen-btn');
            const sel = document.getElementById('days');
            const count = parseInt(document.getElementById('key-count-input').value);
            const days = parseFloat(sel.value);
            const price = parseFloat(sel.options[sel.selectedIndex].getAttribute('data-price'));
            const total = price * count;
            if(currentBalance < total) return toast("رصيدك غير كافٍ!");

            btn.disabled = true;
            btn.innerText = "⏳ جاري التوليد...";
            try {
                const db = await fetchDB();
                if(!db.keys) db.keys = {};
                if(!db.users || !db.users[currentReseller]) throw new Error("الحساب غير موجود");

                const now = Date.now();
                const codes = [];
                for(let i=0; i<count; i++) {
                    const k = `SONIC-XIT-${Math.random().toString(36).substring(2,6).toUpperCase()}-${Math.random().toString(36).substring(2,6).toUpperCase()}`;
                    db.keys[k] = { days: days, used: false, timeText: days>=1?`${days} Days`:`${days*24} Hours`, createdBy: currentReseller, createdAt: now + i };
                    codes.push(k);
                }

                db.users[currentReseller].balance = currentBalance - total;
                await saveDB(db);
                currentBalance -= total;
                document.getElementById('balance-amount').innerText = currentBalance.toFixed(2);

                lastGeneratedCode = codes[0];
                renderKeys(db);
                copyText(lastGeneratedCode);
                toast(`تم توليد ${count} كود بنجاح`);
            } catch (error) {
                console.error(error);
                toast("تعذر التوليد، تحقق من الاتصال وحاول مجدداً");
            } finally {
                btn.disabled = false;
                btn.innerText = "GENERATE KEYS 🔑";
            }
        };
        // دالة تحديد النص عند الضغط عليه
        window.selectText = function(elementId) {
            const el = document.getElementById(elementId);
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        };

        // نسخ متوافق مع Android والمتصفحات التي لا تدعم Clipboard API
        window.copyText = async function(text) {
            const value = String(text ?? "");
            if (!value) {
                toast("لا يوجد كود لنسخه");
                return false;
            }

            // الطريقة الحديثة أولاً
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(value);
                    toast("تم نسخ الكود!");
                    return true;
                }
            } catch (err) {
                // الانتقال للطريقة الاحتياطية
            }

            // طريقة احتياطية تعمل في صفحات HTML المحلية غالباً
            let field;
            try {
                field = document.createElement("textarea");
                field.value = value;
                field.setAttribute("readonly", "");
                field.style.position = "fixed";
                field.style.top = "0";
                field.style.left = "0";
                field.style.width = "1px";
                field.style.height = "1px";
                field.style.padding = "0";
                field.style.opacity = "0.01";
                field.style.fontSize = "16px";
                field.style.userSelect = "text";
                field.style.webkitUserSelect = "text";
                document.body.appendChild(field);
                field.focus();
                field.select();
                field.setSelectionRange(0, field.value.length);

                const copied = document.execCommand("copy");
                field.remove();

                if (copied) {
                    toast("تم نسخ الكود!");
                    return true;
                }
            } catch (err) {
                if (field && field.parentNode) field.remove();
            }

            // لا نعرض نافذة المتصفح المزعجة عند فشل النسخ داخل عارض الملفات
            toast("النسخ التلقائي غير مدعوم هنا؛ اضغط مطولاً على الكود لنسخه");
            return false;
        };

        window.renderKeys = async function(snapshot) {
            const list = document.getElementById('keys-list');
            list.innerHTML = '<div style="text-align:center;padding:10px;">جاري تحميل الأكواد...</div>';
            const db = snapshot || await fetchDB();
            list.innerHTML = '';
            const k = Object.keys(db.keys||{}).filter(x=>db.keys[x].createdBy===currentReseller).sort((a,b)=>db.keys[b].createdAt - db.keys[a].createdAt);
            document.getElementById('key-count').innerText = k.length;
            k.forEach((key, i) => {
                const d = db.keys[key];
                const div = document.createElement('div'); div.className='key-row';
                div.innerHTML = `<div>${i+1}</div><div class="key-name">${key}</div><div><span class="key-status ${d.used?'used':''}">${d.used?'مستخدم':'غير مستخدم'}</span></div><div class="key-actions"><button class="icon-btn copy-action" onclick="copyKey('${key}')" title="نسخ الكود">📋 نسخ</button><button class="icon-btn delete-action" onclick="delKey('${key}')" title="حذف الكود">🗑️ حذف</button></div>`;
                list.appendChild(div);
            });
        };

        window.copyKey = function(k) {
            copyText(k);
        };

        window.delKey = async function(k) { if(!confirm("حذف؟"))return; const db = await fetchDB(); delete db.keys[k]; await saveDB(db); renderKeys(); };
        window.deleteAll = async function() { if(!confirm("حذف الكل؟"))return; const db = await fetchDB(); for(let k in db.keys){ if(db.keys[k].createdBy===currentReseller) delete db.keys[k]; } await saveDB(db); renderKeys(); toast("تم الحذف"); };
        window.logout = function(){ location.reload(); };
    </script>
</body>
</html>
